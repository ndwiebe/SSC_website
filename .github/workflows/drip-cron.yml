name: drip-cron
on:
  schedule:
    - cron: "0 15 * * *"   # daily 15:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: drip-cron
  cancel-in-progress: false

jobs:
  send-drip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate drip credentials
        env:
          DRIP_SECRET: ${{ secrets.DRIP_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for name in DRIP_SECRET SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required Actions secret $name is missing or unavailable."
              missing=1
            fi
          done
          exit "$missing"
      - name: Invoke send-drip
        env:
          DRIP_SECRET: ${{ secrets.DRIP_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Do not automatically retry: a timed-out request may already have sent email.
          status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --connect-timeout 15 --max-time 240 -X POST \
            "https://jqjfxcbyotfozaspqwfz.supabase.co/functions/v1/send-drip" \
            -H "x-drip-secret: $DRIP_SECRET" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY") || {
              echo "::error::Drip request failed at transport level. Check delivery before rerunning."
              exit 1
            }
          if [[ "$status" != 2[0-9][0-9] ]]; then
            echo "::error::Drip endpoint returned HTTP $status. Check credentials and function logs."
            exit 1
          fi
          echo "Drip endpoint returned HTTP $status."
